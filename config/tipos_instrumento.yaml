# ============================================================
# Familia de cada código de instrumento, para las tres fuentes de carteras institucionales:
#   B.1  = renta fija de seguros (columna tipo_instrumento, Circular 1.835)
#   FFMM = cartera nacional de fondos mutuos (FFM_6010400)
#   SP   = cartera desagregada de las AFP (tabla emisor_nac; la columna es el código)
#
# REGLA (igual que las glosas de api/insurer_glossary.py): solo se escribe una familia cuando es
# inequívoca y cada código lleva su evidencia. Un código que no está aquí se muestra tal cual,
# con «(sin glosa)». Los códigos de la SP se confirmaron por quiénes los emiten, porque la SP no
# informa nemotécnico. Pendientes (sin evidencia suficiente): BR, CS, BVL, BEC, BH, PE, PEOIND,
# AFR, AFROIND, CSOIND, EC, OIE, BBP, BBPNEE, OIIF, OTROC, DPSA y los códigos W*/Y*/SNT/SNM/PFI/
# CC2/BCS/BFI/OSAN/EPA/ECO/CSIN/SPA/BRP/BHM/BCA de la SP (su diccionario está pendiente).
# Revisado el 19-nov-2026 contra B.1 y fondos mutuos de 202609 y la SP de 202606.
# ============================================================
codigos:
  # --- Renta fija corporativa -------------------------------------------------------------
  BE:  {familia: "Bono corporativo", evidencia: "B.1/FFMM: nemotécnicos de empresas (BCMPC-, BVIVO-, BENTE-)"}
  DEB: {familia: "Bono corporativo", evidencia: "SP: lo emiten empresas no financieras (Andina, Engie, Lipigas); Inversiones CMPC solo DEB y sus bonos son BCMPC- (BE) en B.1"}
  # --- Renta fija bancaria ----------------------------------------------------------------
  BB:  {familia: "Bono bancario", evidencia: "B.1/FFMM: BCHIE, BBCIN, BTBD- (bancos)"}
