  BEF: {familia: "Bono bancario", evidencia: "SP: solo bancos y Coopeuch (Banco de Chile, BancoEstado, Consorcio)"}
  BSF: {familia: "Bono bancario", evidencia: "SP: solo bancos (Banco de Chile, BancoEstado, BTG Pactual)"}
  # --- Deuda del Fisco y del Banco Central ------------------------------------------------
