  BTP:  {familia: "Deuda del Fisco o del Banco Central", evidencia: "B.1/FFMM: BTP0…; SP: Tesorería General de la República"}
  BCU:  {familia: "Deuda del Fisco o del Banco Central", evidencia: "B.1/FFMM: BCU0…; SP: Banco Central de Chile"}
  PDBC: {familia: "Deuda del Fisco o del Banco Central", evidencia: "B.1/FFMM: nemotécnico BNPDB(C), pagarés descontables del Banco Central"}
