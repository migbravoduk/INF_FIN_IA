# Codificación oficial CMF de TIPO_DE_INVERSION (Circular 1.835, archivo B.8 de Control).
#
# FUENTE de `glosa`: tabla oficial "Codificación SVS | Tipos de Inversión" de la CMF,
#   https://www.cmfchile.cl/sitio/seil/certificacion_cir1835_tinver.php  (consultada jul-2026)
# Los Anexos Técnicos de la circular NO traen esta tabla: el campo TIPO_DE_INVERSION remite a
# "la codificación definida en SEIL, Codificación CMF, Tipo de Inversión". Las glosas de abajo
# se transcribieron programáticamente de esa página; NO editarlas a mano salvo que la CMF las
# cambie.
#
# `label` (etiqueta corta), `clase` y `geo` son AGREGACIONES PROPIAS de este proyecto, no de la
# CMF: existen para poder leer el asset allocation por clase de activo económica y por
# exposición geográfica. Son el único punto a tocar si se quiere reagrupar la cartera.
#
# Criterio de `geo`:
#   - extranjero = el subyacente/emisor está fuera de Chile. Incluye H62/H64 (fondos
#     constituidos EN Chile pero invertidos en valores extranjeros): para medir exposición
#     manda el subyacente, no el domicilio del vehículo.
#   - E20 (bonos de empresas NACIONALES emitidos en el extranjero) queda como `nacional`:
#     el riesgo de crédito es chileno, solo cambia la plaza de emisión.
#
# Códigos LEGADOS presentes en los datos pero ausentes de la tabla vigente de la CMF: `K00`
# (2020-01 a 2022-01) y `Z40` (2020-06 a 2022-02), ambos descontinuados y de monto marginal
# (~3 y ~0 MMM$ acumulados). No se inventa glosa: `insurer_glossary.describe()` los muestra con
# su propio código bajo la clase "Otros", de modo que siguen sumando en los totales.

clases:
  rf_estatal:     {label: "RF Estatal",            orden: 1}
  rf_bancaria:    {label: "RF Bancaria",           orden: 2}
  rf_corporativa: {label: "RF Corporativa",        orden: 3}
  rf_hipotecaria: {label: "Mutuos hipotecarios",   orden: 4}
  rv:             {label: "Renta variable",        orden: 5}
  fondos:         {label: "Fondos",                orden: 6}
  inmobiliario:   {label: "Inmobiliario",          orden: 7}
  creditos:       {label: "Créditos y préstamos",  orden: 8}
  filiales:       {label: "Filiales y coligadas",  orden: 9}
  derivados:      {label: "Derivados y pactos",    orden: 10}
  caja:           {label: "Caja y equivalentes",   orden: 11}
  otros:          {label: "Otros",                 orden: 12}

