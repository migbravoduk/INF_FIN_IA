{#
  partials/afp_cartera.html — Composición de cartera de un fondo (top por %).
  rows = [{glosa, pct}]; period; fund.
#}
{% if rows %}
<div class="chart-block" style="margin-top:1rem">
    <h4>Cartera Fondo {{ fund }} · período {{ period }} <span class="lead">(% del fondo, sistema total · códigos SP)</span></h4>
    <div id="afp-cartera-chart" class="chart"></div>
</div>
<script>
(function () {
    var rows = {{ rows | tojson }};
    function draw() {
        if (!window.Plotly) { return setTimeout(draw, 100); }
        Plotly.newPlot("afp-cartera-chart", [{
            y: rows.map(function (r) { return r.glosa; }).reverse(),
            x: rows.map(function (r) { return r.pct; }).reverse(),
            type: "bar", orientation: "h", marker: { color: "#a78bfa" }
        }], {
            margin: { t: 10, r: 10, b: 30, l: 130 }, height: 340,
            paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
            font: { color: "#94a3b8" },
            xaxis: { gridcolor: "#334155", ticksuffix: "%" }, yaxis: { gridcolor: "#334155" }
        }, { displayModeBar: false, responsive: true });
    }
    draw();
})();
</script>
{% else %}
<p class="loading">Sin datos de cartera para ese fondo.</p>
{% endif %}
