{% extends "base.html" %}

{% block title %}Estados Financieros · INF_FIN_IA{% endblock %}

{% block content %}
<h1>Estados financieros corporativos</h1>
<p class="subtitle">CMF · Empresas y Mercados — balance, resultados y flujo de caja, en serie (vista evolutiva)</p>

<form class="eeff-form"
      hx-get="/eeff/table"
      hx-target="#eeff-results"
      hx-trigger="load, change"
      hx-swap="innerHTML">

    <label>Empresa
        <input list="companies-list" name="company" autocomplete="off"
               placeholder="Escribe para buscar… ({{ companies|length }} empresas)"
               value="{{ companies[0].company_name if companies else '' }}">
        <datalist id="companies-list">
            {% for c in companies %}
            <option value="{{ c.company_name }}"></option>
            {% endfor %}
        </datalist>
    </label>

    <label>Serie
        <select name="serie">
            <option value="anual5">Cierres anuales — últimos 5</option>
            <option value="anual10">Cierres anuales — últimos 10</option>
            <option value="trimq5">Mismo trimestre — últimos 5 años</option>
            <option value="trimq10">Mismo trimestre — últimos 10 años</option>
            <option value="trim8">Trimestral — últimos 8 (2 años)</option>
        </select>
    </label>
</form>

<section id="eeff-results">
    <p class="loading">Cargando estados financieros…</p>
</section>
{% endblock %}
