{% extends "base.html" %}

{% block title %}Ranking · INF_FIN_IA{% endblock %}

{% block content %}
<h1>Ranking de empresas por indicador</h1>
<p class="subtitle">Top 15 empresas (CMF) por un ratio financiero en un período</p>

<form class="eeff-form"
      hx-get="/ranking/table"
      hx-target="#ranking-result"
      hx-trigger="load, change"
      hx-swap="innerHTML">

    <label>Indicador
        <select name="metric">
            {% for k, v in ratios.items() %}
            <option value="{{ k }}">{{ v }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Período
        <select name="period">
            {% for p in periods %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>
    </label>
</form>

<section id="ranking-result">
    <p class="loading">Calculando ranking…</p>
</section>
{% endblock %}
